name: Playwright tests
on:
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install pytest pytest-bdd pytest-playwright && playwright install --with-deps chromium
      - run: python -m pytest generated_tests --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: test-results/junit.xml
